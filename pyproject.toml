[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep_dynamics"
version = "0.2.0"
description = "Golf (Thunderhill) limit-handling vehicle models R1-R6: data loader, spec estimation, training, open-loop evaluation, track and MPPI"
requires-python = ">=3.9"
license = {text = "GPL-3.0"}
classifiers = [
    "Programming Language :: Python :: 3",
]
# deep_dynamics/golf 가 실제로 import 하는 것만
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "torch",
    "matplotlib",
]

[tool.setuptools.packages.find]
include = ["deep_dynamics", "deep_dynamics.golf"]
